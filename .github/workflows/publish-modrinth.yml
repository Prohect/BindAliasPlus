name: Publish to Modrinth

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.4.0)'
        required: true
        default: 'v1.4.0'

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      jars: ${{ steps.set-matrix.outputs.jars }}
    steps:
      - name: Determine tag
        id: tag
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        run: |
          gh release download "${{ steps.tag.outputs.tag }}" --repo "${{ github.repository }}" --dir assets --pattern '*.jar'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build JAR list
        id: set-matrix
        run: |
          jars="$(ls assets/*.jar | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "jars=$jars" >> "$GITHUB_OUTPUT"

  publish:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        jar: ${{ fromJSON(needs.matrix.outputs.jars) }}
    steps:
      - name: Determine tag
        id: tag
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          ver="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        run: |
          gh release download "${{ steps.tag.outputs.tag }}" --repo "${{ github.repository }}" --dir assets --pattern '*.jar'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-id: bind-alias-plus
          files: ${{ matrix.jar }}
          loaders: fabric
          modrinth-name: "BindAliasPlus ${{ steps.tag.outputs.ver }}"
          modrinth-version: ${{ steps.tag.outputs.ver }}
          modrinth-version-type: release

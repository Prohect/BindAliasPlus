name: Publish to Modrinth

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        run: |
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --dir assets --pattern '*.jar'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Extract game versions from JAR filenames
        id: versions
        run: |
          versions=""
          for jar in assets/*.jar; do
            v="$(basename "$jar" .jar | sed 's/.*+mc//')"
            versions="${versions}${v}\n"
          done
          versions="$(printf '%b' "$versions" | sort -t. -k1,1nr -k2,2nr -k3,3nr | uniq)"
          echo "Detected game versions:"
          echo "$versions"
          echo 'versions<<EOF' >> "$GITHUB_OUTPUT"
          echo "$versions" >> "$GITHUB_OUTPUT"
          echo 'EOF' >> "$GITHUB_OUTPUT"

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-id: bind-alias-plus
          files: assets/*.jar
          loaders: fabric
          game-versions: ${{ steps.versions.outputs.versions }}

name: Publish to Modrinth

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - pattern: assets/*+mc26.2.jar
            game-version: "26.2"
          - pattern: assets/*+mc26.1.1.jar
            game-version: "26.1.1"
          - pattern: assets/*+mc1.21.11.jar
            game-version: "1.21.11"
          - pattern: assets/*+mc1.21.8.jar
            game-version: "1.21.8"
    steps:
      - name: Download release assets
        run: |
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --dir assets --pattern '*.jar'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-id: bind-alias-plus
          files: ${{ matrix.pattern }}
          loaders: fabric
          game-versions: ${{ matrix.game-version }}

name: Publish to Modrinth

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        run: |
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --dir assets --pattern '*.jar'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish each JAR to Modrinth
        uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-id: bind-alias-plus
          files: assets/*.jar
          files-primary: assets/*.jar
          loaders: fabric

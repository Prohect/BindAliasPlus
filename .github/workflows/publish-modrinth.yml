name: Publish to Modrinth

on:
  release:
    types: [published]

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      jars: ${{ steps.set-matrix.outputs.jars }}
    steps:
      - name: Download release assets
        run: |
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --dir assets --pattern '*.jar'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build JAR list
        id: set-matrix
        run: |
          jars="$(ls assets/*.jar | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "jars=$jars" >> "$GITHUB_OUTPUT"

  publish:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        jar: ${{ fromJSON(needs.matrix.outputs.jars) }}
    steps:
      - name: Download release assets
        run: |
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --dir assets --pattern '*.jar'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-id: bind-alias-plus
          files: ${{ matrix.jar }}
          loaders: fabric

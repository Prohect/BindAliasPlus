# keep the OS cursor free for agent-driven sessions (camera via yaw/pitch aliases, container hover pinned to slot 14, bypass mining guard)
runAlias +freeCursor

##############################
## User test cfg
var offHand 41
/alias jumpOnce +jump wait\1 -jump
## 36->elytra; 27->firework
alias +fly swapSlot\36\39 jumpOnce wait\1 jumpOnce swapSlot\27\41 +use -use TPS
alias -fly swapSlot\36\39 swapSlot\27\41 wait\2 FPS
alias +fastUse_Var swapSlot\varFastUse\offHand +use
alias -fastUse_Var -use swapSlot\varFastUse\offHand
alias +fastAttack_Var swapSlot\varFastAttack wait\1 +attack
alias -fastAttack_Var -attack swapSlot\varFastAttack
alias +autoClick2 +silent +use alias\"autoClick2_ +use wait\1 builtinRunAlias\autoClick2_ -use" wait\3 builtinRunAlias\autoClick2_ -silent
alias -autoClick2 +silent -use alias\autoClick2_;autoClick2_ -silent

# alias fly_on +silent bind\"mouse5 fly_off" -silent +fly
# alias fly_off +silent bind\"mouse5 fly_on" -silent -fly

bind w +forward
bind a +left
bind s +back
bind d +right
bind e +openInventory
bind q +drop
bind space +jump
bind left.shift +sneak
bind left.control +sprint
bind mouse1 +attack
bind mouse2 +autoClick2
bind mouse3 pickItem
bind mouse5 +fly
# 3 fast use slots via keyboard
bind mouse4 var\varFastUse\19 +fastUse_Var
bind b var\varFastUse\20 +fastUse_Var
bind v var\varFastUse\28 +fastUse_Var
# 1 fast mine slot
bind n var\varFastAttack\29 +fastAttack_Var
# escape +freeCursor, use builtinRun to avoid release of esc automatically bound to +freeCursor
bind esc builtinRunAlias\-freeCursor localSay\"-freeCursor"


##############################
# BindAliasPlus comprehensive auto-test config
#
# Coverage: all builtin aliases' code path except:
#             - reloadCFG (would re-execute runAlias in cfg -> infinite loop)
#             - unloadCFG* (unloads the test config itself)
#             - builtinShutdown (shuts down the game)
#
# Custom-alias naming: name_N  where N = internal wait ticks, name: lowercase underscore separated words(alias registry name as-is)

# ===== CHAT / LOG =====
alias test_say_1 localSay\"[test] say passed" say\"[test] chat say passed"
alias test_localSay_1 localSay\"[test] localSay passed"
alias test_sendCommand_1 sendCommand\seed localSay\"[test] sendCommand passed"
alias test_log_1 log\"[test] log passed" localSay\"[test] log passed"

# ===== SLOT / SWAP / WAIT =====
alias test_slot_1 slot\1 localSay\"[test] slot passed"
alias test_swapSlot_1 swapSlot\1\2 swapSlot\2\1 localSay\"[test] swapSlot passed"
alias test_wait_2 wait\1 localSay\"[test] wait passed"

# ===== CAMERA (rotation) =====
alias test_yaw_1 yaw\10 localSay\"[test] yaw passed"
alias test_pitch_1 pitch\5 localSay\"[test] pitch passed"
alias test_setYaw_1 setYaw\0 localSay\"[test] setYaw passed"
alias test_setPitch_1 setPitch\0 localSay\"[test] setPitch passed"

# ===== CAMERA (perspective) =====
alias test_FPS_1 FPS localSay\"[test] FPS passed"
alias test_TPS_1 TPS localSay\"[test] TPS passed"
alias test_TPS2_1 TPS2 localSay\"[test] TPS2 passed"
alias test_cyclePerspective_1 cyclePerspective localSay\"[test] cyclePerspective passed"

# ===== MOVEMENT (key aliases, press + release) =====
alias test_forward_3 +forward wait\1 -forward localSay\"[test] forward passed"
alias test_back_3 +back wait\1 -back localSay\"[test] back passed"
alias test_left_3 +left wait\1 -left localSay\"[test] left passed"
alias test_right_3 +right wait\1 -right localSay\"[test] right passed"
alias test_jump_3 +jump wait\1 -jump localSay\"[test] jump passed"
alias test_sneak_3 +sneak wait\1 -sneak localSay\"[test] sneak passed"
alias test_sprint_3 +sprint wait\1 -sprint localSay\"[test] sprint passed"

# ===== ACTION (key aliases) =====
alias test_attack_3 +attack wait\1 -attack localSay\"[test] attack passed"
alias test_use_3 +use wait\1 -use localSay\"[test] use passed"
alias test_drop_3 +drop wait\1 -drop localSay\"[test] drop passed"

# ===== SWITCH ALIASES =====
alias test_silent_3 +silent localSay\"[test] silent ON" wait\1 -silent localSay\"[test] silent OFF"

# ===== SCREEN ALIASES =====
alias test_esc_pause_2 closeScreen localSay\"[test] closeScreen passed (no screen)"
alias test_esc_3 esc wait\1 closeScreen localSay\"[test] esc+closeScreen passed"
alias test_toggleInventory_3 toggleInventory wait\1 closeScreen localSay\"[test] toggleInventory passed"
alias test_openInventory_3 +openInventory wait\1 -openInventory localSay\"[test] openInventory passed"
# +advancements toggles; -advancements is a no-op, so toggle off with a second +advancements (no closeScreen — it would confuse the toggle state)
alias test_advancements_3 +advancements wait\1 +advancements localSay\"[test] advancements passed"
alias test_playerList_3 +playerList wait\1 -playerList localSay\"[test] playerList passed"
alias test_debugOverlay_3 +debugOverlay wait\1 -debugOverlay localSay\"[test] debugOverlay passed"
alias test_screenshot_3 +screenshot wait\1 -screenshot localSay\"[test] screenshot passed"

# ===== MISC ACTION ALIASES =====
alias test_swapHand_1 swapHand localSay\"[test] swapHand passed"
alias test_pickItem_1 pickItem localSay\"[test] pickItem passed"
alias test_applyRecipe_1 localSay\"[test] applyRecipe (expected fail: no recipe screen)"

# ===== VAR =====
alias test_var_number_1 var\testNum\42 localSay\"[test] var number passed"
alias test_var_hotbarSlot_1 var\testHbSlot\hotbarSlot localSay\"[test] var hotbarSlot passed"
alias test_var_yaw_1 var\testY\yaw localSay\"[test] var yaw passed"
alias test_var_pitch_1 var\testP\pitch localSay\"[test] var pitch passed"
alias test_var_itemsOfSlot_1 var\testSlotCount\itemsOfSlot1 localSay\"[test] var itemsOfSlot passed"

# ===== ALIAS (define at runtime) + BUILTIN_RUN_ALIAS =====
# testRuntimeAlias pre-defined via CFG so builtinRunAlias works on world-join autoload
# (the alias command uses Fabric's command dispatcher, which is null at tick 0)
alias testRuntimeAlias localSay\"test_runtime_alias_ok"
alias test_alias_define_1 alias\testRuntimeAlias_2;localSay\"test_runtime_alias_2_ok" localSay\"[test] alias define passed"
alias test_builtinRunAlias_1 builtinRunAlias\testRuntimeAlias builtinRunAlias\testRuntimeAlias_2 localSay\"[test] builtinRunAlias passed"

# ===== BIND / UNBIND =====
alias test_bind_1 bind\testBindKey localSay\"hello_from_bind" localSay\"[test] bind passed"
alias test_unbind_1 unbind\testBindKey localSay\"[test] unbind passed"

# ===== LOCK / REAPPLY =====
alias test_lock_2 +lock\jump -lock\jump localSay\"[test] lock passed"
alias test_reapply_2 +forward reapply\forward -forward localSay\"[test] reapply passed"

# ===== UNLOAD CFG BINDS (safe: only unbinds, doesn't unload aliases/vars) =====
# alias test_unloadCFGBinds_1 stays commented - cf. unloadCFG* exclusion



# ===== TEST GROUPS (sub-aliases to avoid cfg line-length issues) =====
alias _grp_chat    test_say_1 test_localSay_1 test_sendCommand_1 test_log_1
alias _grp_slot    test_slot_1 test_swapSlot_1 test_wait_2
alias _grp_cam_rot test_yaw_1 test_pitch_1 test_setYaw_1 test_setPitch_1
alias _grp_cam_per test_FPS_1 test_TPS_1 test_TPS2_1 test_cyclePerspective_1
alias _grp_move    test_forward_3 test_back_3 test_left_3 test_right_3 test_jump_3 test_sneak_3 test_sprint_3
alias _grp_act     test_attack_3 test_use_3 test_drop_3
alias _grp_screen  test_esc_pause_2 test_esc_3 test_toggleInventory_3 test_openInventory_3 test_advancements_3 test_playerList_3 test_debugOverlay_3 test_screenshot_3
alias _grp_misc    test_swapHand_1 test_pickItem_1 test_applyRecipe_1
alias _grp_var     test_var_number_1 test_var_hotbarSlot_1 test_var_yaw_1 test_var_pitch_1 test_var_itemsOfSlot_1
alias _grp_meta    test_alias_define_1 test_builtinRunAlias_1 test_bind_1 test_unbind_1 test_lock_2 test_reapply_2

# ===== MASTER =====
alias all_tests _grp_chat _grp_slot _grp_cam_rot _grp_cam_per _grp_move _grp_act test_silent_3 _grp_screen _grp_misc _grp_var _grp_meta

# ===== Execute =====
runAlias all_tests

# BindAliasPlus comprehensive auto-test config
# Runs on world/server join via quickPlayMultiplayer
#
# Coverage: all builtin aliases except:
#   - /reloadCFG (would re-execute runAlias → infinite loop)
#   - /unloadCFG* (unloads the test config itself)
#
# Sub-alias naming: name_N  where N = internal wait ticks,
# so you can verify the final wait\50 outlasts every inner wait.

# == Tick-prefix smoke test (fires immediately on autoload) ==
/alias tickSmokeTest_0 log\tickPrefixSmokeTest
/runAlias tickSmokeTest_0

# == Variable setup (all VarAlias source types) ==
/var testSlot hotbarSlot
/var testNum 42
/var testYaw yaw
/var testPitch pitch
/var testOffhandCount itemsOfSlot0

# == Sub-aliases ==

# -- movement toggles --
/alias forwardTest_5 +forward wait\5 -forward log\forwardTest
/alias backTest_5 +back wait\5 -back log\backTest
/alias leftTest_5 +left wait\5 -left log\leftTest
/alias rightTest_5 +right wait\5 -right log\rightTest
/alias jumpTest_5 +jump wait\5 -jump log\jumpTest
/alias sneakTest_5 +sneak wait\5 -sneak log\sneakTest
/alias sprintTest_5 +sprint wait\5 -sprint log\sprintTest

# -- combat toggles --
/alias attackTest_3 +attack wait\3 -attack log\attackTest
/alias useTest_3 +use wait\3 -use log\useTest

# -- slot / swap --
/alias slotTest_5 slot\3 wait\5 slot\1 log\slotTest
/alias swapHandTest_5 swapHand wait\5 swapHand log\swapHandTest

# swapSlot paths (slot range: 1-9 hotbar, 10-36 inventory, 37-40 equipment, 41 offhand)
# Path A2 — two hotbar slots (3-way offhand swap)
/alias swapSlot_hotbar_5 swapSlot\1\2 wait\5 swapSlot\1\2 log\swapSlot_hotbar
# Path A1 — hotbar + offhand (direct offhand swap)
/alias swapSlot_offhand_5 swapSlot\1\41 wait\5 swapSlot\1\41 log\swapSlot_offhand
# Path B3 — two inventory slots (opens inventory screen, 3-way click swap)
/alias swapSlot_inv_15 swapSlot\10\11 wait\15 swapSlot\10\11 log\swapSlot_inv
# Path B2 — hotbar + inventory (opens inventory screen, click swap to hotbar)
/alias swapSlot_hotbar_inv_15 swapSlot\1\10 wait\15 swapSlot\1\10 log\swapSlot_hotbar_inv
# Path B1 — offhand + inventory (opens inventory screen, click swap to offhand)
/alias swapSlot_offhand_inv_15 swapSlot\41\10 wait\15 swapSlot\41\10 log\swapSlot_offhand_inv
# Path 1 — single arg (defaults second slot to selected hotbar)
/alias swapSlot_single_5 swapSlot\3 wait\5 swapSlot\3 log\swapSlot_single

# -- camera --
/alias camTest_15 cyclePerspective wait\15 cyclePerspective wait\10 FPS log\camTest
/alias yaw_pitch_test_15 get_yaw_pitch yaw\80 pitch\-20 wait\15 reset_yaw_pitch wait\5 log\yaw_pitch_test
/alias setAngleTest_10 setYaw\180 setPitch\45 wait\10 setYaw\0 setPitch\0 log\setAngleTest

# -- chat / log (already produce output, no inner log needed) --
/alias test_say_0 say\BindAliasPlus test say
/alias test_localSay_0 localSay\"Hello, world!"
/alias test_sendCommand_0 sendCommand\"say BindAliasPlus test sendCommand"

# -- misc --
/alias pickTest_0 pickItem log\pickTest
/alias openInvTest_15 +openInventory wait\15 -openInventory log\openInvTest
/alias toggleInvTest_10 toggleinventory wait\10 toggleinventory log\toggleInvTest
/alias playerListTest_10 +playerList wait\5 +screenshot wait\1 -playerList log\playerListTest
/alias screenshotTest_1 +screenshot wait\1 log\screenshotTest
/alias dropTest_3 +drop wait\3 -drop log\dropTest
/alias lockTest_44 +lockKey\+forward wait\44 -lockKey\+forward log\lockTest

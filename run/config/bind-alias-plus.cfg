# BindAliasPlus comprehensive auto-test config
# Runs on world/server join via quickPlayMultiplayer

# == Variable setup ==
/var testSlot hotbarSlot
/var testNum 42

# == Sub-aliases ==
/alias forwardTest +forward wait\10 -forward
/alias jumpTest +jump wait\5 -jump
/alias slotTest slot\3 wait\5 slot\1
/alias swapTest swapHand wait\5 swapHand
/alias camTest cyclePerspective wait\15 cyclePerspective wait\10 FPS
/alias lockTest +lockKey\+forward wait\44 -lockKey\+forward
/alias silentTest +silent wait\5 -silent
/alias yaw_pitch_test get_yaw_pitch yaw\80 pitch\-20 wait\15 reset_yaw_pitch wait\5
/alias test_localSay localSay\"Hello, world!"
/alias pickTest pickItem
/alias openInvTest +openInventory wait\15 -openInventory
/alias dropTest +drop wait\3 -drop
/alias reapplyTest +forward wait\10 reapply\forward -forward

# == Master test chain ==
# All tests run in sequence; final wait\60 delays shutdown by 3s
/alias allTests forwardTest wait\5 jumpTest wait\5 slotTest wait\5 swapTest wait\5 camTest wait\5 lockTest wait\5 silentTest wait\5 yaw_pitch_test wait\5 test_localSay wait\5 dropTest wait\5 pickTest wait\5 openInvTest wait\5 reapplyTest wait\5 log\AllTestsCompleted wait\90
# builtinShutdown

# == Execute ==
/runAlias allTests

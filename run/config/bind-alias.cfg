# --- BindAlias E2E test aliases ---
# Auto-loaded on world join (ClientPlayConnectionEvents.JOIN).
# Tests exercise new code paths: screenshot pipeline, snap-task machinery, etc.
# Results appear in the game log (run/logs/latest.log).

# Ensure free cursor so the agent can interact with screens
runAlias +freeCursor wait/20 esc sendCommand/"tick rate 1"

# --- Screenshot pipeline (captureScreenshotB64) ---
# Exercises ScreenshotCapture + NativeImageMixin → base64 encode path.
alias testScreenshot runAlias +screenshot wait/5 -screenshot

# --- Verify snap-task machinery via log markers ---
# The snap parameter is driven by the MCP bridge, not cfg aliases.
# These aliases produce log markers that the agent can grep to confirm
# the mod loaded and the event loop is ticking.
alias testCfgLoaded log/"test_cfg_loaded"
alias testTickLog log/"test_tick"

# --- diffState + printScreen (agent_msg channel) ---
# Exercises the new agent_msg channel: diffState captures a state diff,
# printScreen grabs an async screenshot — both keyed by clientTick (deduped per tick).
alias testDiffState diffState log/"test_diffState_done"
alias testPrintScreen printScreen log/"test_printScreen_done"
alias testBoth diffState printScreen log/"test_both_done"

# --- Define + exercise a test alias (exercises handleDefineAlias) ---
alias testDefine defineAlias/testE2EAlias runAlias/testE2EAlias log/"test_e2e_alias_ran"
# Clean up
alias testCleanup unloadCFGAliases log/"test_cleanup_done"
